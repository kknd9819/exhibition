server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  application:
    name: exhibition-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/exhibition?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:exhibition}
    password: ${MYSQL_PASSWORD:exhibition}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
  global-config:
    banner: false
    db-config:
      id-type: input
      logic-delete-value: 1
      logic-not-delete-value: 0

exhibition:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  internal-query-token: ${INTERNAL_QUERY_TOKEN:local-alpha-internal}
  alpha-show-otp: ${ALPHA_SHOW_OTP:true}
  file-storage-root: ${FILE_STORAGE_ROOT:./data/files}
